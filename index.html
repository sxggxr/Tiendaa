<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiseñoWebMX</title>
<meta name="description" content="Galería interactiva de servicios de DiseñoWeb MX: páginas web, tiendas en línea, portafolios, invitaciones digitales y asesorías de programación.">
<meta name="theme-color" content="#2bb3a6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<!--
  CÓMO USARLO EN TU PÁGINA
  1) Como página aparte: guarda este archivo como showroom.html en la carpeta de tu proyecto
     de Vercel y enlázalo desde tu menú: <a href="/showroom.html">Servicios</a>
  2) Dentro de tu index.html: copia el bloque <style> (todo cuelga de la clase .sr), la
     <section class="sr" id="showroom"> y el <script>. Pon la sección dentro de un contenedor
     con altura, por ejemplo <div style="height:100svh">...</div>
  3) Cambia tu WhatsApp, textos y precios en CONFIG e ITEMS (al inicio del script).
-->

<style>
/* Plan visual: pared oscura con vitrinas iluminadas (como el video). Una sola luz de marca
   (verde azulado #2bb3a6) y un color de luz propio por vitrina. La cámara hace zoom a la pared. */
:root{
  --wall:#0b0f0e; --ink:#eef3f1; --muted:#8c9d98; --line:rgba(255,255,255,.12);
  --teal:#2bb3a6; --teal-ink:#05211e;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --serif:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.65,0,.2,1);
}
html,body{height:100%;margin:0;background:var(--wall);color-scheme:dark}

/* ---------- escenario ---------- */
.sr{position:relative;width:100%;height:100%;min-height:560px;overflow:hidden;overflow:clip;isolation:isolate;
  background:radial-gradient(120% 90% at 50% -10%,#1b2724 0%,var(--wall) 62%);
  color:var(--ink);font-family:var(--display);touch-action:pan-y;user-select:none;-webkit-user-select:none;
  -webkit-font-smoothing:antialiased;--tone:var(--teal)}
.sr *,.sr *::before,.sr *::after{box-sizing:border-box}
.sr :where(h1,h2,h3,h4,p,dl,dd,ul,pre){margin:0}
.sr :where(button){font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.sr :focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.sr .vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

.sr .floor{position:absolute;left:-10%;right:-10%;bottom:-8%;height:24%;z-index:0;pointer-events:none;
  background:radial-gradient(60% 100% at 50% 100%,color-mix(in oklab,var(--tone) 55%,transparent),transparent 70%);
  opacity:.45;transition:opacity .8s}
.sr[data-open] .floor{opacity:.28}
.sr .beam{position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen;opacity:0;transition:opacity .5s;
  background:radial-gradient(420px 420px at var(--mx,50%) var(--my,30%),rgba(255,255,255,.075),transparent 70%)}
.sr[data-live] .beam{opacity:1}
.sr[data-open] .beam{opacity:0}

/* ---------- pared y vitrinas ---------- */
.sr .wall{position:absolute;inset:0;z-index:1;padding:96px 4vw 60px;display:grid;gap:2vh 2.2vw;
  grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));
  transform-origin:0 0;transition:transform 1.15s var(--ease)}
.sr.jump .wall{transition:none}
.sr .cell{position:relative;display:grid;grid-template-rows:minmax(0,1fr) auto auto;justify-items:center;
  min-height:0;cursor:pointer;border-radius:12px;transition:opacity .7s var(--ease);-webkit-tap-highlight-color:transparent}
.sr .spot{position:absolute;left:-6%;right:-6%;top:-8%;bottom:34px;pointer-events:none;opacity:.25;transition:opacity .6s;
  background:radial-gradient(55% 75% at 50% 100%,color-mix(in oklab,var(--glow) 30%,transparent),transparent 72%)}
.sr .ow{position:relative;container-type:size;width:100%;min-height:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.sr .obj{position:relative;width:min(90cqw,calc(84cqh*var(--ar)));aspect-ratio:var(--ar);border-radius:clamp(3px,3.2%,12px)}
.sr .obj.ph{border-radius:12% / 6%}
.sr .face{position:absolute;inset:0;container-type:inline-size;border-radius:inherit;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 0 0 1px rgba(255,255,255,.1),0 18px 34px -12px rgba(0,0,0,.75);transition:transform .6s var(--ease)}
.sr .shelf{position:relative;width:96%;height:7px;border-radius:3px;background:linear-gradient(#ffffff59,#ffffff14);box-shadow:0 1px 0 #ffffff40 inset}
.sr .shelf::after{content:"";position:absolute;left:4%;right:4%;top:100%;height:14px;border-radius:50%;background:var(--glow);
  filter:blur(12px);opacity:.38;transition:opacity .5s,transform .5s;animation:led 1.6s var(--ease) backwards;animation-delay:calc(var(--n)*110ms)}
@keyframes led{from{opacity:0}}
.sr .tag{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:13px;text-align:center;transition:opacity .5s}
.sr .tag b{font-weight:600;font-size:clamp(11px,1.05vw,15px);letter-spacing:.01em}
.sr .tag b i{font-style:normal;color:var(--glow);font-variant-numeric:tabular-nums;margin-right:.6em;font-size:.82em;letter-spacing:.06em}
.sr .tag small{color:var(--muted);font-size:clamp(10px,.82vw,12px);font-variant-numeric:tabular-nums}

.sr .cell:hover .face,.sr .cell:focus-visible .face{transform:translateY(-3%)}
.sr .cell:hover .spot,.sr .cell.on .spot{opacity:1}
.sr .cell:hover .shelf::after,.sr .cell.on .shelf::after{opacity:.95;transform:scaleX(1.06)}
.sr .cell:focus-visible{outline-offset:-3px}
@media (hover:hover){.sr:not([data-open]) .wall:has(.cell:hover) .cell:not(:hover){opacity:.5}}
.sr[data-open] .cell:not(.on){opacity:.3}
.sr[data-open] .cell:not(.on):hover{opacity:.55}
.sr[data-open] .cell:not(.on) .spot{opacity:.15}
.sr[data-open] .tag{opacity:0}

/* ---------- cabecera ---------- */
.sr .top{position:absolute;z-index:6;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:20px clamp(16px,4vw,48px);background:linear-gradient(#0b0f0ed9,transparent);pointer-events:none}
.sr .top>*{pointer-events:auto}
.sr .brand{display:flex;flex-direction:column;gap:3px}
.sr .brand b{font-weight:800;font-stretch:80%;letter-spacing:.14em;font-size:13px;text-transform:uppercase;white-space:nowrap}
.sr .brand span{font:italic 400 21px/1 var(--serif);color:#cfe7e3}
.sr .acts{display:flex;gap:10px;align-items:center}
.sr .pill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);
  background:#ffffff0d;backdrop-filter:blur(8px);font-size:13px;font-weight:600;white-space:nowrap;transition:background .25s,border-color .25s,opacity .4s,transform .4s}
.sr .pill:hover{background:#ffffff1f;border-color:#ffffff40}
.sr .pill b{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;padding:0 5px;background:var(--teal);color:var(--teal-ink);font-size:11px;font-variant-numeric:tabular-nums}
.sr .pill b.bump{animation:bump .45s var(--ease)}
@keyframes bump{40%{transform:scale(1.4)}}
.sr .back{opacity:0;pointer-events:none;transform:translateX(8px)}
.sr[data-open] .back{opacity:1;pointer-events:auto;transform:none;transition-delay:0s,0s,.45s,.45s}

.sr .foot{position:absolute;z-index:3;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:16px;
  padding:0 clamp(16px,4vw,48px) 18px;font-size:12px;color:var(--muted);pointer-events:none;transition:opacity .5s}
.sr[data-open] .foot{opacity:0}
.sr .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:9px;background:var(--teal);animation:ping 2.2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 #2bb3a680}70%,100%{box-shadow:0 0 0 9px #2bb3a600}}

/* ---------- panel de detalle ---------- */
.sr .panel{position:absolute;z-index:5;left:clamp(20px,5vw,80px);top:50%;width:min(38vw,460px);max-height:calc(100% - 110px);overflow:auto;
  display:flex;flex-direction:column;gap:18px;opacity:0;pointer-events:none;transform:translate(-24px,-50%);
  transition:opacity .45s,transform .8s var(--ease);scrollbar-width:none}
.sr[data-open] .panel{opacity:1;pointer-events:auto;transform:translate(0,-50%);transition-delay:.5s}
.sr .panel.in>*{animation:rise .7s var(--ease) backwards;animation-delay:calc(var(--k)*70ms + 60ms)}
.sr .panel>:nth-child(1){--k:0}.sr .panel>:nth-child(2){--k:1}.sr .panel>:nth-child(3){--k:2}.sr .panel>:nth-child(4){--k:3}
.sr .panel>:nth-child(5){--k:4}.sr .panel>:nth-child(6){--k:5}.sr .panel>:nth-child(7){--k:6}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.sr .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.sr .eyebrow i{font-style:normal;color:var(--glow)}
.sr .ttl{font-weight:800;font-stretch:78%;text-transform:uppercase;font-size:clamp(32px,4.4vw,68px);line-height:.9;letter-spacing:-.01em;text-wrap:balance}
.sr .ttl em{display:block;font:italic 400 1.14em/.95 var(--serif);text-transform:none;letter-spacing:0;color:var(--glow);margin-top:.05em}
.sr .desc{color:#b9c8c4;font-size:15px;line-height:1.5;max-width:42ch}
.sr .specs{display:grid;border-top:1px solid var(--line)}
.sr .specs div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.sr .specs dt{color:var(--muted)}
.sr .specs dd{text-align:right;font-variant-numeric:tabular-nums}
.sr .price{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.sr .price small{color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.sr .price b{font-size:clamp(30px,3.2vw,44px);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sr .price span{color:var(--muted);font-size:13px}
.sr .ctas{display:flex;flex-wrap:wrap;gap:10px}
.sr .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:46px;padding:0 20px;border-radius:999px;
  font-weight:700;font-size:14px;text-decoration:none;color:inherit;transition:transform .2s,background .2s,border-color .2s}
.sr .btn.go{background:var(--teal);color:var(--teal-ink)}
.sr .btn.go:hover{background:#3fd0c1;transform:translateY(-1px)}
.sr .btn .sm{display:none}
.sr .btn.alt{border:1px solid #ffffff33}
.sr .btn.alt:hover{background:#ffffff14}
.sr .btn.alt[aria-pressed="true"]{border-color:var(--teal);background:#2bb3a61f}
.sr .fine{font-size:11.5px;color:var(--muted);line-height:1.45}

.sr .pager{position:absolute;z-index:5;left:66.5%;bottom:clamp(18px,5vh,44px);display:flex;align-items:center;gap:14px;
  opacity:0;pointer-events:none;transform:translate(-50%,10px);transition:opacity .4s,transform .5s var(--ease)}
.sr[data-open] .pager{opacity:1;pointer-events:auto;transform:translate(-50%,0);transition-delay:.7s}
.sr .arrow{width:44px;height:44px;border-radius:50%;border:1px solid #ffffff33;display:grid;place-items:center;transition:background .2s}
.sr .arrow:hover{background:#ffffff1f}
.sr .count{min-width:64px;text-align:center;font-size:13px;letter-spacing:.14em;color:var(--muted);font-variant-numeric:tabular-nums}
.sr .count b{color:var(--ink);font-weight:600}

/* ---------- mi cotización ---------- */
.sr .scrim{position:absolute;inset:0;z-index:7;background:#000000b3;opacity:0;pointer-events:none;transition:opacity .4s}
.sr[data-bag] .scrim{opacity:1;pointer-events:auto}
.sr .bag{position:absolute;z-index:8;top:0;right:0;bottom:0;width:min(92%,390px);padding:22px;display:flex;flex-direction:column;gap:16px;
  background:#0f1514;border-left:1px solid var(--line);transform:translateX(102%);transition:transform .5s var(--ease)}
.sr[data-bag] .bag{transform:none}
.sr .bag header{display:flex;align-items:center;justify-content:space-between}
.sr .bag h3{font-weight:800;font-stretch:80%;text-transform:uppercase;letter-spacing:.08em;font-size:15px}
.sr .bag .x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);font-size:18px;line-height:1}
.sr .bag ul{list-style:none;padding:0;display:grid;gap:0;overflow:auto;flex:1;align-content:start}
.sr .bag li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.sr .bag li div{flex:1;display:grid;gap:2px}
.sr .bag li b{font-size:14px;font-weight:600}
.sr .bag li small{color:var(--muted);font-size:12px}
.sr .bag li button{width:30px;height:30px;border-radius:50%;color:var(--muted);font-size:18px}
.sr .bag li button:hover{background:#ffffff1a;color:var(--ink)}
.sr .bag .empty{color:var(--muted);font-size:14px;line-height:1.5;padding:8px 0}
.sr .bag .btn[aria-disabled="true"]{opacity:.35;pointer-events:none}
.sr .bag .clear{font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;align-self:center}

/* ---------- maquetas de cada vitrina (todo en cqw: escala con la cámara) ---------- */
.sr .face{font-size:2.6cqw;line-height:1.25;text-align:left}
.sr .chrome{flex:none;height:7cqw;display:flex;align-items:center;gap:1.4cqw;padding:0 2.4cqw;background:var(--chrome,#0000001a)}
.sr .chrome i{width:1.7cqw;height:1.7cqw;border-radius:50%;background:currentColor;opacity:.3}
.sr .chrome span{margin-left:2cqw;flex:1;max-width:46cqw;height:3.6cqw;border-radius:2cqw;background:#00000014;display:flex;align-items:center;padding:0 2cqw;font-size:2.1cqw;opacity:.75}
.sr .pg{flex:1;min-height:0;padding:3cqw 4cqw;display:grid;gap:3cqw;align-content:start}
.sr .pg nav{display:flex;align-items:center;gap:3.4cqw;font-size:2.3cqw;font-weight:500}
.sr .pg nav b{margin-right:auto}
.sr .pg nav .cta{padding:1cqw 2.4cqw;border-radius:3cqw}

.sr .cafe{background:#f5ead8;color:#3a2416;--chrome:#e7d5b8}
.sr .cafe nav b{font:400 3.6cqw/1 var(--serif)}
.sr .cafe .cta{background:#c4602b;color:#fff5e8}
.sr .cafe .hero{display:grid;grid-template-columns:1fr 26cqw;gap:3cqw;align-items:center}
.sr .cafe h4{font:400 8.6cqw/.95 var(--serif)}
.sr .cafe h4 em{color:#c4602b}
.sr .cafe .hero p{margin-top:1.8cqw;font-size:2.3cqw;opacity:.75;max-width:32cqw}
.sr .cafe .cup{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#f5ead8 0 14%,#4a2b1a 15% 34%,#c4602b 35% 56%,#e9b97a 57% 100%);box-shadow:0 2cqw 4cqw #5a321a44}
.sr .cafe .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:2.2cqw}
.sr .cafe .cards span{height:9.5cqw;border-radius:1.8cqw;background:#ecd9bb;padding:1.8cqw;display:flex;flex-direction:column;justify-content:flex-end;gap:.8cqw;font-size:2cqw;font-weight:600}
.sr .cafe .cards span::before{content:"";width:4cqw;height:.9cqw;border-radius:1cqw;background:#c4602b}

.sr .shop{background:#fff0f3;color:#3b1d29;--chrome:#f7d6df}
.sr .shop nav b{font:italic 400 3.9cqw/1 var(--serif)}
.sr .shop .cta{background:#3b1d29;color:#ffe9ef}
.sr .shop .ban{border-radius:2cqw;background:linear-gradient(100deg,#e0527f,#f59ab3);color:#fff;padding:2.6cqw 3.4cqw;display:flex;justify-content:space-between;align-items:center;font:400 4.8cqw/1 var(--serif)}
.sr .shop .ban small{font:600 2cqw var(--display);letter-spacing:.08em;text-transform:uppercase;background:#fff;color:#c13b67;padding:1cqw 2cqw;border-radius:2cqw}
.sr .shop .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2.2cqw}
.sr .shop .grid span{display:grid;gap:.8cqw;font-size:1.9cqw;font-weight:600}
.sr .shop .grid span::before{content:"";height:15cqw;border-radius:1.8cqw;background:var(--c)}
.sr .shop .grid em{font-style:normal;font-weight:400;opacity:.7}

.sr .port{background:#0e1514;color:#e8f2ef;--chrome:#18211f}
.sr .port .pg{grid-template-columns:.9fr 1.3fr;gap:4cqw;align-content:stretch}
.sr .port .who{display:flex;flex-direction:column;justify-content:space-between}
.sr .port .who small{font-size:1.9cqw;letter-spacing:.18em;text-transform:uppercase;color:#35d0c0}
.sr .port h4{margin-top:2cqw;font:400 9.6cqw/.92 var(--serif)}
.sr .port h4 em{color:#35d0c0}
.sr .port .who p{font-size:2.1cqw;opacity:.65;max-width:26cqw}
.sr .port .mos{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:1.6cqw}
.sr .port .mos span{border-radius:1.4cqw;background:var(--c)}
.sr .port .mos span:first-child{grid-row:span 2}

.sr .inv{background:#0d0f0e}
.sr .inv .scr{position:absolute;inset:2.4cqw;border-radius:10cqw;overflow:hidden;background:#fbf5e9;color:#3a3326;display:flex;flex-direction:column;align-items:center;
  justify-content:space-between;text-align:center;padding:14cqw 7cqw 8cqw}
.sr .inv .notch{position:absolute;top:2.6cqw;left:50%;width:22cqw;height:5.4cqw;margin-left:-11cqw;border-radius:3cqw;background:#0d0f0e}
.sr .inv small{font-size:3cqw;letter-spacing:.3em;text-transform:uppercase;color:#b08a3a}
.sr .inv .mono{width:27cqw;height:27cqw;border-radius:50%;border:.6cqw solid #c9a45a;display:grid;place-items:center;font:400 11cqw/1 var(--serif);color:#b08a3a}
.sr .inv h4{font:400 13cqw/.95 var(--serif)}
.sr .inv h4 em{color:#b08a3a}
.sr .inv .dt{font-size:3.6cqw;letter-spacing:.14em;text-transform:uppercase}
.sr .inv .cd{display:grid;grid-template-columns:repeat(4,1fr);gap:2cqw;width:100%}
.sr .inv .cd span{display:grid;gap:.4cqw;padding:2cqw 0;border-radius:2cqw;background:#efe4cb;font-size:2.2cqw;text-transform:uppercase;letter-spacing:.08em}
.sr .inv .cd b{font:400 7cqw/1 var(--serif);letter-spacing:0}
.sr .inv .rsvp{padding:3.2cqw 6cqw;border-radius:6cqw;background:#b08a3a;color:#fffaf0;font-size:3.2cqw;font-weight:600}
.sr .inv .pl{font-size:2.8cqw;opacity:.7}

.sr .java{--acc:#ff7a4d;--k:#ff9d6e}
.sr .cpp{--acc:#6f9bff;--k:#93b3ff}
.sr .java,.sr .cpp{background:#12171b;color:#d7e0e6;--chrome:#0b0f12;--s:#9fd88a;--n:#7cc4ff;--t:#f4d06f}
.sr .java .chrome,.sr .cpp .chrome{color:#fff}
.sr .java .chrome span,.sr .cpp .chrome span{background:#ffffff12;font:500 2.1cqw var(--mono)}
.sr .java pre,.sr .cpp pre{flex:1;padding:3cqw 3cqw 0;font:500 2.5cqw/1.5 var(--mono);white-space:pre;overflow:hidden;counter-reset:l}
.sr .java pre span,.sr .cpp pre span{display:block;min-height:1.5em}
.sr .java pre span::before,.sr .cpp pre span::before{counter-increment:l;content:counter(l);display:inline-block;width:3cqw;margin-right:2.4cqw;text-align:right;opacity:.3}
.sr .java k,.sr .cpp k{color:var(--k);font-style:normal}
.sr .java s,.sr .cpp s{color:var(--s);text-decoration:none}
.sr .java n,.sr .cpp n{color:var(--n)}
.sr .java t,.sr .cpp t{color:var(--t)}
.sr .out{flex:none;margin:2cqw 3cqw 3cqw;padding:2cqw 2.6cqw;border-radius:1.6cqw;background:#0a0d10;font:500 2.3cqw/1.5 var(--mono);color:#9fb3bd;border:.3cqw solid #ffffff14}
.sr .out b{color:var(--acc);font-weight:600}

.sr .doc{background-color:#fbf9f1;color:#2a2a24;background-image:repeating-linear-gradient(transparent 0 6.2cqw,#9ec2d640 6.2cqw 6.5cqw)}
.sr .doc .note{position:absolute;right:5cqw;top:6cqw;width:24cqw;padding:3cqw;background:#ffe27a;transform:rotate(4deg);font:italic 400 4cqw/1.1 var(--serif);box-shadow:0 1.4cqw 2.4cqw #0003}
.sr .doc .pgd{flex:1;margin-left:9cqw;padding:7cqw 6cqw 6cqw 6cqw;border-left:.5cqw solid #e5736a80;display:flex;flex-direction:column;gap:4.4cqw}

/* =====================================================================
   SISTEMA: pared, cámara, detalle, lista de cotización y WhatsApp
   ===================================================================== */
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const root = $("#showroom"), wall = $("#wall"), panel = $("#panel");
  const N = ITEMS.length;
  const pad = n => String(n).padStart(2, "0");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const name = it => it.title.join(" ");
  const wa = text => `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(text)}`;
  const isMobile = () => matchMedia("(max-width:900px) and (orientation:portrait)").matches;

  $("#brandName").textContent = CONFIG.brand;
  $("#brandTag").textContent = CONFIG.tagline;
  $("#note").textContent = CONFIG.note.split(". ")[0] + ". IVA si requieres factura.";
  $("#bagNote").textContent = CONFIG.note;

  /* ---- pared ---- */
  wall.innerHTML = ITEMS.map((it, i) => `
    <div class="cell" role="button" tabindex="0" data-i="${i}" style="--glow:${it.glow};--n:${i}" aria-label="Ver ${esc(name(it))} de cerca">
      <i class="spot"></i>
      <div class="ow"><div class="obj${it.art === "inv" ? " ph" : ""}" style="--ar:${it.ar}"><div class="face ${it.art}">${ART[it.art]()}</div></div></div>
      <i class="shelf"></i>
      <div class="tag"><b><i>${pad(i + 1)}</i>${esc(name(it))}</b><small>${esc(it.tag)}</small></div>
    </div>`).join("");
  const cells = [...wall.children];
  const objs = cells.map(c => $(".obj", c));

  /* ---- mi cotización ---- */
  const KEY = CONFIG.storageKey;
  const bag = new Set((() => { try { return JSON.parse(localStorage.getItem(KEY) || "[]").filter(id => ITEMS.some(i => i.id === id)); } catch (e) { return []; } })());
  const saveBag = () => { try { localStorage.setItem(KEY, JSON.stringify([...bag])); } catch (e) {} };
  const bagEl = $("#bag");

  function renderBag(bump) {
    const n = $("#bagN"); n.textContent = bag.size;
    if (bump) { n.classList.remove("bump"); void n.offsetWidth; n.classList.add("bump"); }
    const items = ITEMS.filter(i => bag.has(i.id));
    $("#bagList").innerHTML = items.length
      ? items.map(i => `<li><div><b>${esc(name(i))}</b><small>${esc(i.tag)}</small></div><button type="button" data-rm="${i.id}" aria-label="Quitar ${esc(name(i))}">×</button></li>`).join("")
      : `<li class="empty">Todavía no agregas servicios. Abre una vitrina y toca «Agregar a mi cotización».</li>`;
    const send = $("#bagSend");
    send.setAttribute("aria-disabled", items.length ? "false" : "true");
    send.href = items.length ? wa("Hola, quiero cotizar estos servicios:\n" + items.map(i => `- ${name(i)} (${i.tag})`).join("\n") + "\n\nLos vi en tu página.") : "#";
    $("#bagClear").style.visibility = items.length ? "visible" : "hidden";
  }
  function setBag(open) {
    if (open) root.dataset.bag = "1"; else delete root.dataset.bag;
    bagEl.inert = !open;
  }
  function toggleItem(id) {
    bag.has(id) ? bag.delete(id) : bag.add(id);
    saveBag(); renderBag(true); syncToggle();
  }

  /* ---- panel de detalle ---- */
  let cur = -1, lastFocus = null;
  function panelHTML(i) {
    const it = ITEMS[i];
    return `
      <div class="eyebrow"><i>${pad(i + 1)}</i> / ${pad(N)} · Vitrina</div>
      <h2 class="ttl">${esc(it.title[0])}<em>${esc(it.title[1])}</em></h2>
      <p class="desc">${esc(it.desc)}</p>
      <dl class="specs">${it.specs.map(([a, b]) => `<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join("")}</dl>
      <div class="price">${it.priceLabel ? `<small>${esc(it.priceLabel)}</small>` : ""}<b>${esc(it.price)}</b>${it.price.startsWith("$") ? "<span>MXN</span>" : ""}</div>
      <div class="ctas">
        <a class="btn go" target="_blank" rel="noopener" href="${wa(`Hola, me interesa cotizar: ${name(it)} (${it.tag}). Lo vi en tu página.`)}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>
          Cotizar este servicio</a>
        <button class="btn alt" type="button" data-toggle="${it.id}" aria-pressed="false"><span class="lg"></span><span class="sm"></span></button>
      </div>
      <p class="fine">${esc(CONFIG.note)}</p>`;
  }
  function syncToggle() {
    const b = $("[data-toggle]", panel); if (!b) return;
    const on = bag.has(b.dataset.toggle);
    b.setAttribute("aria-pressed", on);
    b.setAttribute("aria-label", on ? "Quitar de mi cotización" : "Agregar a mi cotización");
    $(".lg", b).textContent = on ? "Quitar de mi cotización" : "Agregar a mi cotización";
    $(".sm", b).textContent = on ? "Quitar" : "Agregar";
  }
  function renderPanel() {
    panel.innerHTML = panelHTML(cur); syncToggle();
    panel.scrollTop = 0;
    panel.classList.remove("in"); void panel.offsetWidth; panel.classList.add("in");
    $("#count").innerHTML = `<b>${pad(cur + 1)}</b> / ${pad(N)}`;
  }

  /* ---- cámara: lleva la vitrina elegida al centro y la agranda ---- */
  function aim() {
    const sr = root.getBoundingClientRect(), W = sr.width, H = sr.height;
    const wr = wall.getBoundingClientRect();
    const t = getComputedStyle(wall).transform;
    const k = t === "none" ? 1 : new DOMMatrixReadOnly(t).a;       // escala actual de la pared
    const o = objs[cur].getBoundingClientRect();
    const lw = o.width / k, lh = o.height / k;                    // medidas sin zoom
    const cx = (o.left - wr.left) / k + lw / 2, cy = (o.top - wr.top) / k + lh / 2;
    const m = isMobile();
    const tx = m ? W * .5 : W * .665, ty = m ? H * .27 : H * .49;  // dónde queremos el objeto
    const s = Math.min((m ? W * .8 : W * .46) / lw, (m ? H * .25 : H * .56) / lh);
    wall.style.transform = `translate(${tx - cx * s}px,${ty - cy * s}px) scale(${s})`;
  }
  const jump = fn => { root.classList.add("jump"); fn(); requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove("jump"))); };
  const setHash = h => { try { if (location.hash !== "#" + h) location.hash = h; } catch (e) {} };

  function open(i, opts = {}) {
    const first = cur < 0;
    cur = ((i % N) + N) % N;
    if (first) lastFocus = document.activeElement;
    root.dataset.open = "1";
    root.style.setProperty("--tone", ITEMS[cur].glow);
    cells.forEach((c, k) => c.classList.toggle("on", k === cur));
    opts.instant ? jump(aim) : aim();
    renderPanel();
    if (!opts.fromHash) setHash(ITEMS[cur].id);
  }
  function close(fromHash) {
    if (cur < 0) return;
    cur = -1; delete root.dataset.open;
    root.style.removeProperty("--tone");
    cells.forEach(c => c.classList.remove("on"));
    wall.style.transform = "";
    if (!fromHash) setHash("galeria");
    if (lastFocus && lastFocus.classList && lastFocus.classList.contains("cell")) lastFocus.focus({ preventScroll: true });
  }
  function route(initial) {
    const i = ITEMS.findIndex(x => x.id === location.hash.slice(1));
    if (i >= 0) { if (i !== cur) open(i, { fromHash: true, instant: initial }); }
    else close(true);
  }

  /* ---- eventos ---- */
  wall.addEventListener("click", e => { const c = e.target.closest(".cell"); if (c) open(+c.dataset.i); });
  wall.addEventListener("keydown", e => {
    const c = e.target.closest(".cell");
    if (c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); open(+c.dataset.i); }
  });
  $("#back").addEventListener("click", () => close());
  root.addEventListener("click", e => {
    const g = e.target.closest("[data-go]"); if (g) open(cur + +g.dataset.go);
    const t = e.target.closest("[data-toggle]"); if (t) toggleItem(t.dataset.toggle);
    const r = e.target.closest("[data-rm]"); if (r) { bag.delete(r.dataset.rm); saveBag(); renderBag(); syncToggle(); }
  });
  $("#bagBtn").addEventListener("click", () => setBag(true));
  $("#bagClose").addEventListener("click", () => setBag(false));
  $("#scrim").addEventListener("click", () => setBag(false));
  $("#bagClear").addEventListener("click", () => { bag.clear(); saveBag(); renderBag(); syncToggle(); });

  addEventListener("keydown", e => {
    if (root.dataset.bag) { if (e.key === "Escape") setBag(false); return; }
    if (cur < 0) return;
    if (e.key === "ArrowRight") open(cur + 1);
    else if (e.key === "ArrowLeft") open(cur - 1);
    else if (e.key === "Escape") close();
  });

  // deslizar con el dedo para cambiar de vitrina
  let sx = 0, sy = 0, st = 0, sOk = false;
  root.addEventListener("pointerdown", e => { sx = e.clientX; sy = e.clientY; st = Date.now(); sOk = !e.target.closest(".bag, .panel .btn, .pill"); });
  root.addEventListener("pointerup", e => {
    if (cur < 0 || !sOk) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4 && Date.now() - st < 700) open(cur + (dx < 0 ? 1 : -1));
  });

  // haz de luz que sigue al cursor
  root.addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse") return;
    const r = root.getBoundingClientRect();
    root.style.setProperty("--mx", (e.clientX - r.left) + "px");
    root.style.setProperty("--my", (e.clientY - r.top) + "px");
    root.dataset.live = "1";
  });
  root.addEventListener("pointerleave", () => delete root.dataset.live);

  addEventListener("resize", () => { if (cur >= 0) jump(aim); });
  addEventListener("hashchange", () => route(false));

  renderBag();
  route(true);
})();
</script>

(() => {
  const panel = document.getElementById("panel");
  const li = a => a.map(s => `<li>${s}</li>`).join("");
  const sec = (k, h, body) => `<section class="x-sec" style="--k:${k}"><h3>${h}</h3>${body}</section>`;
  const build = id => {
    const it = ITEMS.find(i => i.id === id), x = EXTRAS[id], title = it.title.join(" ");
    const wa = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent("Hola, tengo una duda sobre: " + title + ". Lo vi en tu página.")}`;
    return sec(7, x.t, `<ul class="x-chips">${li(x.chips)}</ul>`)
      + sec(8, "Qué incluye", `<ul class="x-list">${li(x.inc)}</ul>`)
      + sec(9, "Cómo trabajamos", `<ol class="x-steps">${x.steps.map(([a, b]) => `<li><div><b>${a}</b><span>${b}</span></div></li>`).join("")}</ol>`)
      + sec(10, "Preguntas frecuentes", `<div class="x-faq">${x.faq.map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join("")}</div>`)
      + sec(11, "¿Tienes dudas?", `<a class="btn go" target="_blank" rel="noopener" href="${wa}">Escríbeme por WhatsApp</a>`)
      + `<button class="x-hint" type="button">Más abajo ↓</button>`;
  };
  const hint = () => panel.querySelector(".x-hint");
  const sync = () => {
    const h = hint(); if (!h) return;
    h.hidden = panel.scrollHeight <= panel.clientHeight + 4;
    h.textContent = panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 8 ? "Volver arriba ↑" : "Más abajo ↓";
  };
  const decorate = () => {
    const t = panel.querySelector("[data-toggle]"); if (!t) return;
    const id = t.dataset.toggle; if (!EXTRAS[id]) return;
    panel.dataset.skin = id;
    if (panel.querySelector(".x-sec")) return;
    panel.insertAdjacentHTML("beforeend", build(id));
    sync();
  };
  panel.addEventListener("scroll", sync, { passive: true });
  panel.addEventListener("click", e => {
    if (!e.target.closest(".x-hint")) return;
    const end = panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 8;
    panel.scrollTo({ top: end ? 0 : panel.scrollTop + panel.clientHeight * .8, behavior: "smooth" });
  });
  panel.addEventListener("toggle", sync, true);
  addEventListener("resize", sync);
  new MutationObserver(decorate).observe(panel, { childList: true });
  decorate();
})();
</script>
